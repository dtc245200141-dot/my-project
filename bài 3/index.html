<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập thẻ liên kết HTML</title>
  </head>
  <body>
    <!-- Tiêu đề h1 -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự <ul> chứa các liên kết -->
    <ul>
      <!-- Liên kết 1: Mở trong tab mới (target="_blank") -->
      <li>
        <a href="https://www.google.com" target="_blank"
          >Google (Mở trong tab mới)</a
        >
      </li>

      <!-- Liên kết 2: Trang web bên ngoài khác -->
      <li>
        <a href="https://github.com">Trang chủ GitHub</a>
      </li>

      <!-- Liên kết 3: Trang web bên ngoài khác -->
      <li>
        <a href="https://www.wikipedia.org"
          >Trang Bách khoa toàn thư Wikipedia</a
        >
      </li>

      <!-- Liên kết 4: Đến file HTML khác trong cùng thư mục -->
      <li>
        <a href="about.html">Xem trang Giới thiệu (About)</a>
      </li>

      <!-- Liên kết 5: Mở ứng dụng gửi Email (mailto:) -->
      <li>
        <a href="mailto:your-email@gmail.com">Gửi email cho tôi</a>
      </li>
    </ul>
  </body>
</html>
