<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục Responsive với CSS Flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 1. Header -->
      <header class="header">Header (Tiêu đề trang)</header>

      <!-- 2. Navigation -->
      <nav class="nav">Navigation (Menu điều hướng)</nav>

      <!-- Khung chứa phần thân (Main Content + Sidebar) -->
      <div class="main-container">
        <!-- 3. Main Content -->
        <main class="content">Main Content (Nội dung chính)</main>

        <!-- 4. Sidebar -->
        <aside class="sidebar">Sidebar (Nội dung phụ)</aside>
      </div>

      <!-- 5. Footer -->
      <footer class="footer">Footer (Thông tin cuối trang)</footer>
    </div>
  </body>
</html>
