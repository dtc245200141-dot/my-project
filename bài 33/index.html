<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục Responsive CSS Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-container">
      <header class="header">Header (Tiêu đề trang)</header>
      <nav class="nav">Navigation (Menu điều hướng)</nav>

      <aside class="sidebar">Sidebar (Nội dung phụ)</aside>
      <footer class="footer">Footer (Thông tin cuối trang)</footer>
    </div>
  </body>
</html>
