<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS Flex Flow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Thực hành thuộc tính flex-flow</h2>

    <!-- VÍ DỤ 1: ROW NOWRAP -->
    <h3>Ví dụ 1: flex-flow: row nowrap (Mặc định - Trái qua phải)</h3>
    <div class="container container-1">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>

    <br />
    <hr />
    <br />

    <!-- VÍ DỤ 2: ROW-REVERSE NOWRAP -->
    <h3>Ví dụ 2: flex-flow: row-reverse nowrap (Ngược lại - Phải qua trái)</h3>
    <div class="container container-2">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>
  </body>
</html>
