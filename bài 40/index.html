<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Navbar Practice</title>
    <!-- Nhúng CSS Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      /* Thêm một chút không gian đệm để nội dung trang web dễ nhìn */
      .content-demo {
        padding: 40px 20px;
        text-align: center;
        background-color: #f8f9fa;
        margin-top: 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <!-- THANH ĐIỀU HƯỚNG NAVBAR BOOTSTRAP -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Tên thương hiệu / Website -->
        <a class="navbar-brand" href="#">MyWebsite</a>

        <!-- Nút bấm hiển thị trên Mobile (Hamburger Button) -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Khung chứa các mục điều hướng (Sẽ thu gọn trên Mobile) -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>

            <!-- Menu thả xuống (Dropdown) -->
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Services
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Web Design</a></li>
                <li><a class="dropdown-item" href="#">SEO Marketing</a></li>
              </ul>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Khu vực nội dung minh họa -->
    <div class="container">
      <div class="content-demo">
        <h1>Chào mừng bạn đến với bài thực hành Bootstrap Navbar</h1>
        <p class="lead">
          Hãy thử thu nhỏ trình duyệt hoặc bật F12 để kiểm tra tính năng
          Responsive trên Mobile!
        </p>
      </div>
    </div>

    <!-- Nhúng JavaScript Bootstrap (Bắt buộc phải có để Dropdown và Menu Mobile hoạt động) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
