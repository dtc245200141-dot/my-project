<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS Grid Gap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- VÍ DỤ 1: KHOẢNG CÁCH HÀNG VÀ CỘT BẰNG NHAU -->
    <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h2>
    <div class="grid-container ex-equal-gap">
      <div>Ô 1</div>
      <div>Ô 2</div>
      <div>Ô 3</div>
      <div>Ô 4</div>
    </div>

    <br />
    <hr />
    <br />

    <!-- VÍ DỤ 2: KHOẢNG CÁCH HÀNG VÀ CỘT KHÁC NHAU -->
    <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
    <div class="grid-container ex-mixed-gap">
      <div>Ô 1</div>
      <div>Ô 2</div>
      <div>Ô 3</div>
      <div>Ô 4</div>
      <div>Ô 5</div>
      <div>Ô 6</div>
    </div>
  </body>
</html>
