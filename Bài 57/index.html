<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Grid SASS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout-overlay">
      <div class="gridcontainer">
        <!-- Header Section -->
        <div class="gridwrapper header-wrapper">
          <div class="gridcontent header-content"></div>
        </div>

        <!-- Body Content Section -->
        <div class="gridwrapper body-wrapper">
          <!-- Sidebar Menu Trái -->
          <div class="gridcontent sidebar-left">
            <div class="menu-item"></div>
            <div class="menu-item"></div>
            <div class="menu-item"></div>
            <div class="menu-item"></div>
          </div>

          <!-- Các cột rỗng giữa -->
          <div class="gridcontent empty-col"></div>
          <div class="gridcontent empty-col"></div>
          <div class="gridcontent empty-col"></div>
          <div class="gridcontent empty-col"></div>
          <div class="gridcontent empty-col"></div>
          <div class="gridcontent empty-col"></div>

          <!-- Khung Nội dung Phải -->
          <div class="gridcontent main-right">
            <div class="content-box"></div>
          </div>
        </div>

        <!-- Footer Section -->
        <div class="gridwrapper footer-wrapper">
          <div class="gridcontent footer-content"></div>
        </div>
      </div>
    </div>

    <!-- Background Lưới 12 Cột -->
    <div class="gridcontainer grid-background">
      <div class="gridwrapper full-height">
        <div class="gridcontent border-col first-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
        <div class="gridcontent border-col"></div>
      </div>
    </div>

    <p class="description">
      Resize the browser window to see that this grid will respond to the
      resizing, and always use 100% of the available space.
    </p>
  </body>
</html>
