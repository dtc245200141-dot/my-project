<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập Tạo Form Đơn Giản</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f9;
        margin: 20px;
        color: #333;
      }

      .container {
        max-width: 650px;
        margin: 0 auto;
      }

      .form-card {
        background: #ffffff;
        padding: 25px 30px;
        margin-bottom: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h2 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 8px;
        margin-top: 0;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .inline-label {
        display: inline-block;
        font-weight: normal;
        margin-right: 15px;
        cursor: pointer;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }

      textarea {
        resize: vertical;
        height: 80px;
      }

      .btn-group {
        margin-top: 20px;
      }

      button,
      input[type="submit"],
      input[type="reset"] {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        margin-right: 10px;
      }

      input[type="submit"],
      button[type="submit"] {
        background-color: #2ecc71;
        color: white;
      }

      input[type="submit"]:hover,
      button[type="submit"]:hover {
        background-color: #27ae60;
      }

      input[type="reset"] {
        background-color: #e74c3c;
        color: white;
      }

      input[type="reset"]:hover {
        background-color: #c0392b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- PHẦN 1: FORM CƠ BẢN -->
      <div class="form-card">
        <h2>Phần 1: Form Liên Hệ Cơ Bản</h2>
        <form action="#" method="POST">
          <div class="form-group">
            <label for="yourname">Họ và tên:</label>
            <input
              type="text"
              id="yourname"
              name="yourname"
              placeholder="Nhập họ và tên..."
              required
            />
          </div>

          <div class="form-group">
            <label for="email_p1">Email:</label>
            <input
              type="email"
              id="email_p1"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label>Sở thích:</label>
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="reading" /> Đọc
              sách</label
            >
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="music" /> Nghe
              nhạc</label
            >
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="sports" /> Thể
              thao</label
            >
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="travel" /> Du
              lịch</label
            >
          </div>

          <div class="btn-group">
            <input type="submit" value="Gửi thông tin" />
            <input type="reset" value="Nhập lại" />
          </div>
        </form>
      </div>

      <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
      <div class="form-card">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
          <div class="form-group">
            <label for="fullname"
              >Họ và tên <span style="color: red">*</span>:</label
            >
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Nguyễn Văn A"
              required
            />
          </div>

          <div class="form-group">
            <label for="email_p2"
              >Email <span style="color: red">*</span>:</label
            >
            <input
              type="email"
              id="email_p2"
              name="email"
              placeholder="nguyenvana@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Số điện thoại:</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="0901234567"
            />
          </div>

          <div class="form-group">
            <label for="birthday">Ngày sinh:</label>
            <input type="date" id="birthday" name="birthday" />
          </div>

          <div class="form-group">
            <label>Giới tính:</label>
            <label class="inline-label"
              ><input type="radio" name="gender" value="male" checked />
              Nam</label
            >
            <label class="inline-label"
              ><input type="radio" name="gender" value="female" /> Nữ</label
            >
            <label class="inline-label"
              ><input type="radio" name="gender" value="other" /> Khác</label
            >
          </div>

          <div class="form-group">
            <label for="address">Địa chỉ:</label>
            <textarea
              id="address"
              name="address"
              placeholder="Nhập địa chỉ của bạn..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="course">Khóa học:</label>
            <select id="course" name="course">
              <option value="html_css">HTML & CSS</option>
              <option value="javascript">JavaScript</option>
              <option value="java">Java</option>
              <option value="python">Python</option>
            </select>
          </div>

          <div class="form-group">
            <label>Hình thức học:</label>
            <label class="inline-label"
              ><input type="radio" name="study_type" value="online" checked />
              Online</label
            >
            <label class="inline-label"
              ><input type="radio" name="study_type" value="offline" />
              Offline</label
            >
          </div>

          <div class="form-group">
            <label>Sở thích:</label>
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="coding" /> Lập
              trình</label
            >
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="game" /> Chơi
              game</label
            >
            <label class="inline-label"
              ><input type="checkbox" name="hobby" value="reading" /> Đọc
              sách</label
            >
          </div>

          <div class="form-group">
            <label for="note">Ghi chú:</label>
            <textarea
              id="note"
              name="note"
              placeholder="Nhập ghi chú bổ sung..."
            ></textarea>
          </div>

          <div class="btn-group">
            <input type="submit" value="Đăng ký" />
            <input type="reset" value="Nhập lại" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
