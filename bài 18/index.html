<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang web của tôi</title>
    <!-- Liên kết đến tệp style.css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Element & ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Class Selector -->
    <p class="bio-text">
      Xin chào! Tôi là một học viên lập trình web tại CodeGym. Tôi yêu thích
      sáng tạo và tìm hiểu các công nghệ mới.
    </p>

    <!-- Grouping & Pseudo-class Selector -->
    <h2>Sở thích của tôi</h2>
    <ul class="hobby-list">
      <li class="hobby-item">Đọc sách công nghệ</li>
      <li class="hobby-item">Lập trình web</li>
      <li class="hobby-item">Chơi thể thao</li>
    </ul>

    <!-- Class & Hover Effect -->
    <button class="custom-btn">Nhấn vào đây</button>
  </body>
</html>
