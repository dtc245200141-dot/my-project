<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS Flex Grow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Thực hành thuộc tính flex-grow (5 Flex Items)</h2>
    <p>
      Ô số 2 áp dụng flex-grow: 1 (hoặc số lớn hơn) sẽ tự động chiếm phần không
      gian còn trống trong container.
    </p>

    <div class="container">
      <div class="item item1">Ô 1</div>
      <div class="item item2">Ô 2 (Flex-grow)</div>
      <div class="item item3">Ô 3</div>
      <div class="item item4">Ô 4</div>
      <div class="item item5">Ô 5</div>
    </div>
  </body>
</html>
