<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập Thẻ Hình Ảnh HTML</title>
  </head>
  <body>
    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- Thẻ img chứa link ảnh (src) và mô tả thay thế (alt) -->
    <img
      src="https://picsum.photos/600/400"
      alt="Một bức ảnh thiên nhiên ngẫu nhiên đẹp mắt"
      width="600"
    />
  </body>
</html>
