<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang web với màu nền và ảnh nền</title>
    <!-- Liên kết tới tệp style.css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Tiêu đề h1 -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả -->
    <p class="description">
      Trang web này được thiết kế để thực hành cách kết hợp màu nền và hình ảnh
      nền trong CSS giúp giao diện trở nên sinh động và thu hút hơn.
    </p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền -->
    <div class="important-box">
      <h2>Nội dung quan trọng</h2>
      <p>
        Đây là khu vực hiển thị thông tin nổi bật được trang trí bằng ảnh nền và
        căn giữa đẹp mắt.
      </p>
    </div>
  </body>
</html>
